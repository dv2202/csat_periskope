<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Periskope — Control Panel</title>
    <style>
      :root {
        --bg: #0b0c10;
        --panel: #15171f;
        --border: #272a35;
        --text: #e6e8ee;
        --muted: #9aa0ad;
        --accent: #6366f1;
        --green: #22c55e;
        --red: #ef4444;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg:#f5f6f8; --panel:#fff; --border:#e3e5ea; --text:#15171f; --muted:#5b616e; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
      .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; }
      button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
      button:active { transform: translateY(1px); }
      input[type=text] { flex: 1; min-width: 200px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 14px; }
      label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
      .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
      .pill.open { background: rgba(99,102,241,.15); color: var(--accent); }
      .pill.closed { background: rgba(34,197,94,.15); color: var(--green); }
      .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; }
      .kv .k { color: var(--muted); }
      pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; max-height: 320px; margin: 0; }
      .muted { color: var(--muted); }
      code { background: var(--bg); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Mock Periskope</h1>
      <div class="sub">Act out the CSAT flow by hand — each button fires a signed webhook at the app. Target: <code id="target">…</code></div>

      <div class="card">
        <h2>Ticket</h2>
        <div class="kv">
          <div class="k">ID</div><div id="t-id">—</div>
          <div class="k">Subject</div><div id="t-subject">—</div>
          <div class="k">Status</div><div><span id="t-status" class="pill">—</span></div>
          <div class="k">Assignee</div><div id="t-assignee">—</div>
          <div class="k">CSAT props</div><div id="t-custom" class="muted">—</div>
        </div>
      </div>

      <div class="card">
        <h2>Actions</h2>
        <div class="row" style="margin-bottom:12px">
          <button onclick="post('/control/close')">Close ticket</button>
          <button class="ghost" onclick="post('/control/reopen')">Reopen ticket</button>
          <button class="ghost" onclick="post('/control/duplicate')">Send duplicate webhook</button>
        </div>
        <div class="row">
          <input id="reply" type="text" placeholder="Customer replies… e.g. 5 bahut badhiya service 🙏" />
          <label class="chk"><input id="quote" type="checkbox" checked /> quote survey</label>
          <button onclick="sendReply()">Customer replies</button>
        </div>
      </div>

      <div class="card">
        <h2>Custom properties</h2>
        <div id="props" class="muted">—</div>
      </div>

      <div class="card">
        <h2>Activity log</h2>
        <pre id="log">—</pre>
      </div>
    </div>

    <script>
      async function refresh() {
        try {
          const s = await (await fetch('/control/state')).json();
          document.getElementById('target').textContent = s.webhookTarget;
          const t = s.ticket;
          if (t) {
            document.getElementById('t-id').textContent = t.ticket_id;
            document.getElementById('t-subject').textContent = t.subject;
            const st = document.getElementById('t-status');
            st.textContent = t.status;
            st.className = 'pill ' + (t.status === 'closed' ? 'closed' : 'open');
            document.getElementById('t-assignee').textContent = t.assignee || '—';
            const custom = Object.entries(t.custom || {});
            document.getElementById('t-custom').textContent = custom.length ? custom.map(([k, v]) => `${k}: ${v || '∅'}`).join('  ·  ') : '—';
          }
          document.getElementById('props').textContent = s.properties.length
            ? s.properties.map((p) => `${p.name} (${p.kind})`).join('  ·  ')
            : 'none yet — run `npm run setup:periskope`';
          document.getElementById('log').textContent = s.log.map((l) => `${l.at.slice(11, 19)}  ${l.line}`).join('\n') || '—';
        } catch (e) {
          document.getElementById('log').textContent = 'cannot reach mock: ' + e;
        }
      }
      async function post(path, body) {
        try {
          const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
          const j = await r.json();
          console.log(path, j);
        } catch (e) { console.error(e); }
        setTimeout(refresh, 150);
      }
      function sendReply() {
        const text = document.getElementById('reply').value;
        const quote = document.getElementById('quote').checked;
        if (!text.trim()) return;
        post('/control/reply', { text, quote });
        document.getElementById('reply').value = '';
      }
      document.getElementById('reply').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendReply(); });
      refresh();
      setInterval(refresh, 2000);
    </script>
  </body>
</html>
